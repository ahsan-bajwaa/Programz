<!DOCTYPE html>
<html>
<head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Studnet Profile</title>
</head>

<body>
        <header>
            <h2>Fill this form</h2>

            <div style="background-color:aqua" , font>
                <form>
                    <div>
                        <label>Name:</label>
                        <input type="text" placeholder="Enter your name...">
                    </div>
                    <div>
                        <label>Roll No</label>
                        <input type="number" placeholder="000 or 001">
                    </div>
                    <div>
                        <label>Section</label>
                        <input type="text" placeholder="CB or IT">
                    </div>
                    <div>
                        <label>Email</label>
                        <input type="email" placeholder="example@gmail.com">
                    </div>
                    <div>
                        <label>Date of Birth</label>
                        <input type="date">
                    </div>
                    <div>
                        <button type="submit">Submit</button>
                    </div>
                </form>
            </div>
        </header>
</body>

</html>
